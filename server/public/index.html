<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>emous — Anonymous Hyperlocal Confessions & Viral Secret Inbox</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emous: {
                bg: '#0D0D11',
                surface: '#181820',
                pink: '#FF1E8E',
                lime: '#CCFF00',
                yellow: '#FFE600',
                cyan: '#00F0FF',
                purple: '#7928CA',
              }
            },
            fontFamily: {
              display: ['Syne', 'sans-serif'],
              sans: ['Space Grotesk', 'sans-serif'],
            },
            boxShadow: {
              brutal: '3px 3px 0px 0px #000000',
              'brutal-lg': '5px 5px 0px 0px #000000',
            }
          }
        }
      };
    }
  </script>
  <style>
    body {
      background-color: #0D0D11;
      color: #FFFFFF;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(255, 30, 142, 0.16) 0%, transparent 35%),
        radial-gradient(circle at 85% 25%, rgba(204, 255, 0, 0.13) 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(255, 230, 0, 0.09) 0%, transparent 40%);
      overflow-x: hidden;
    }
    .flyer-card {
      border: 2.5px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
    }
    .flyer-btn {
      border: 2.5px solid #000000;
      box-shadow: 3px 3px 0px 0px #000000;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
    }
    .flyer-btn:hover {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 5px 5px 0px 0px #000000;
    }
    .flyer-btn:active {
      transform: translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0px 0px #000000;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Continuous Streetwear Ticker / Marquee for Hashtag Filter Bar */
    @keyframes tagMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .tag-marquee-viewport {
      overflow-x: auto;
      position: relative;
      mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    }
    .tag-marquee-track {
      display: flex;
      width: max-content;
      gap: 0.45rem;
      animation: tagMarquee 24s linear infinite;
      padding: 0.25rem 0;
    }
    .tag-marquee-viewport:hover .tag-marquee-track {
      animation-play-state: paused;
    }

    /* Icon-only Card Action Pill that smoothly expands to show its label on hover */
    .card-action-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      min-width: 34px;
      padding: 0 8px;
      border-radius: 11px;
      border: 2px solid #000000;
      box-shadow: 2.5px 2.5px 0px 0px #000000;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      white-space: nowrap;
    }
    .card-action-pill:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px 0px #000000;
      padding: 0 11px;
    }
    .card-action-label {
      max-width: 0;
      opacity: 0;
      margin-left: 0;
      overflow: hidden;
      transition: max-width 0.26s ease, opacity 0.2s ease, margin-left 0.22s ease;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .card-action-pill:hover .card-action-label,
    .card-action-pill:focus-visible .card-action-label {
      max-width: 170px;
      opacity: 1;
      margin-left: 5px;
    }

    /* Reaction Pill Pop Animation */
    .reaction-pill {
      border: 2px solid #000000;
      box-shadow: 2px 2px 0px 0px #000000;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease;
    }
    .reaction-pill:hover {
      transform: scale(1.07);
    }
    .reaction-pill:active {
      transform: scale(0.94);
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-280px) scale(1.35); opacity: 0; }
    }
    .emoji-float {
      animation: floatUp 1.8s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-emous-pink selection:text-white">
  <div id="app"></div>

  <script>
    const API_BASE = '/api/v1';
    const STORAGE_DEVICE_KEY = 'emous_device_fingerprint_v1';
    const STORAGE_HANDLE_KEY = 'emous_user_handle_v1';
    const STORAGE_POSTS_CACHE_KEY = 'emous_posts_cache_v1';
    const STORAGE_INBOX_CACHE_KEY = 'emous_inbox_cache_v1';
    const STORAGE_REACTIONS_CACHE_KEY = 'emous_reactions_cache_v1';
    const STORAGE_DEMO_MODE_KEY = 'emous_demo_mode_v1';

    const POPULAR_TAGS = [
      '#Work',
      '#SexAndDating',
      '#Crypto',
      '#Gym',
      '#Politics',
      '#Religion',
      '#Campus',
      '#NightOut'
    ];

    const TOPIC_DICTIONARIES = {
      '#Work': ['work', 'office', 'boss', 'coworker', 'hr', 'salary', 'job', 'meeting', 'standup', 'client', 'manager', '9-5'],
      '#SexAndDating': ['sex', 'hookup', 'crush', 'dating', 'ex', 'boyfriend', 'girlfriend', 'situationship', 'kiss', 'bed', 'tinder', 'sneaky', 'cheating'],
      '#Crypto': ['crypto', 'bitcoin', 'btc', 'eth', 'solana', 'memecoin', 'token', 'wallet', 'web3', 'airdrop', 'bull', 'bear'],
      '#Gym': ['gym', 'workout', 'protein', 'creatine', 'cardio', 'bench', 'squat', 'fitness', 'gains', 'muscle'],
      '#Politics': ['politics', 'president', 'election', 'vote', 'government', 'senate', 'minister', 'policy', 'tax'],
      '#Religion': ['religion', 'church', 'mosque', 'pray', 'prayer', 'god', 'faith', 'pastor', 'imam', 'bible', 'quran', 'sin'],
      '#Campus': ['campus', 'college', 'uni', 'lecturer', 'professor', 'exam', 'hostel', 'dorm', 'semester', 'gpa', 'student'],
      '#NightOut': ['nightout', 'club', 'party', 'rave', 'warehouse', 'drinks', 'drunk', 'bar', 'rooftop', 'dj', 'tequila', 'margaritas', 'tacos', '2am', '3am']
    };

    function detectAutoTag(text, explicitMode) {
      if (explicitMode && explicitMode !== 'AUTO') return explicitMode;
      const hashMatch = /#([a-zA-Z0-9_]{2,28})/.exec(text || '');
      if (hashMatch) {
        return '#' + hashMatch[1].charAt(0).toUpperCase() + hashMatch[1].slice(1);
      }
      const lower = (text || '').toLowerCase();
      let bestTag = '#Confessions';
      let bestScore = 0;
      for (const [cat, words] of Object.entries(TOPIC_DICTIONARIES)) {
        let score = 0;
        for (const w of words) {
          if (new RegExp('\\b' + w + '\\b', 'i').test(lower)) score++;
        }
        if (score > bestScore) {
          bestScore = score;
          bestTag = cat;
        }
      }
      return bestTag;
    }

    const REACTION_LIST = [
      { type: 'fire', emoji: '🔥', label: 'Fire' },
      { type: 'skull', emoji: '💀', label: 'Dead' },
      { type: 'eyes', emoji: '👀', label: 'Tea' },
      { type: 'heart', emoji: '❤️', label: 'Real' }
    ];

    const STORY_THEMES = [
      {
        id: 'story-pink-lime',
        name: 'Pink x Acid Lime',
        canvasBg: '#0D0D11',
        topCardBg: '#FF1E8E',
        topCardText: '#FFFFFF',
        bottomCardBg: '#CCFF00',
        bottomCardText: '#0D0D11'
      },
      {
        id: 'story-yellow-pink',
        name: 'Electric Yellow x Magenta',
        canvasBg: '#0D0D11',
        topCardBg: '#FFE600',
        topCardText: '#0D0D11',
        bottomCardBg: '#FF1E8E',
        bottomCardText: '#FFFFFF'
      },
      {
        id: 'story-lime-white',
        name: 'Lime x Crisp White',
        canvasBg: '#120458',
        topCardBg: '#CCFF00',
        topCardText: '#0D0D11',
        bottomCardBg: '#FFFFFF',
        bottomCardText: '#0D0D11'
      }
    ];

    const QUICK_PROMPTS = [
      'Be honest... what was your first impression of me? 👀',
      'Drop a secret you would never tell me to my face 🤫',
      'Lowkey had a crush on you since we met ngl 🔥',
      'What song reminds you of me on late night drives? 🎧',
      'Rate my vibe from 1-10 & don’t hold back ⚡'
    ];

    const state = {
      route: window.location.pathname.startsWith('/ask/') ? 'ask' : 'main',
      askTargetHandle: decodeURIComponent(window.location.pathname.replace(/^\/ask\//, '') || 'GoldenWizard'),
      activeScreen: new URLSearchParams(window.location.search).get('tab') === 'inbox' ? 'inbox' : 'feed',
      mobileSimulator: false,
      viewportWidth: typeof window !== 'undefined' ? window.innerWidth : 1024,
      deviceId: '',
      myHandle: localStorage.getItem(STORAGE_HANDLE_KEY) || 'GoldenWizard',
      demoGoldenWizard: localStorage.getItem(STORAGE_DEMO_MODE_KEY) === null
        ? true
        : localStorage.getItem(STORAGE_DEMO_MODE_KEY) === 'true',
      soundAlertsEnabled: true,
      isNotifOpen: false,
      lastKnownInboxCount: null,
      feedMode: 'global',
      selectedTag: 'All',
      selectedPhrase: '',
      dynamicTags: [...POPULAR_TAGS],
      trendingPeriod: 'all',
      trendingTags: [],
      trendingPhrases: [],
      coords: { lat: 40.7128, lng: -74.006 },
      gpsStatus: '5-mile radius active',
      posts: [],
      inboxMessages: [],
      unreadCount: 0,
      toast: null,
      isComposerOpen: false,
      draftContent: '',
      draftTag: 'AUTO',
      draftBg: {
        id: 'grad-neon-riot',
        type: 'gradient',
        name: 'Neon Riot',
        value: 'linear-gradient(135deg, #FF1E8E 0%, #7928CA 100%)',
        colors: ['#FF1E8E', '#7928CA'],
        textColor: '#FFFFFF',
        badgeBg: '#CCFF00',
        badgeText: '#0D0D11'
      },
      activeStoryMsg: null,
      replyText: '',
      storyThemeId: 'story-pink-lime',
      askQuestion: '',
      askThemeIndex: 0,
      askSentSuccess: false
    };

    function isCompactMobile() {
      return state.mobileSimulator || state.viewportWidth < 640;
    }

    window.addEventListener('resize', () => {
      const nextW = window.innerWidth;
      if ((nextW < 640) !== (state.viewportWidth < 640)) {
        state.viewportWidth = nextW;
        render();
      } else {
        state.viewportWidth = nextW;
      }
    });

    // Play a punchy 2-note Web Audio synth chime when a new secret message arrives
    function playNotificationChime() {
      if (!state.soundAlertsEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const playNote = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        playNote(587.33, now, 0.16);        // D5
        playNote(880.0, now + 0.14, 0.28);  // A5
      } catch (e) {}
    }

    function updateDocumentTitleBadge() {
      const unread = state.unreadCount || 0;
      document.title = unread > 0
        ? `(${unread} New!) emous — Anonymous Feed & Secret Inbox`
        : 'emous — Anonymous Hyperlocal Confessions & Viral Secret Inbox';
    }

    function getOrCreateDeviceId() {
      let id = localStorage.getItem(STORAGE_DEVICE_KEY);
      if (!id) {
        id = 'web-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
        localStorage.setItem(STORAGE_DEVICE_KEY, id);
      }
      state.deviceId = id;
      return id;
    }

    function getCurrentHandle() {
      return state.demoGoldenWizard ? 'GoldenWizard' : state.myHandle;
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => {
        if (state.toast === msg) {
          state.toast = null;
          render();
        }
      }, 3400);
    }

    function formatRelativeTime(iso) {
      const diffSec = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      return `${Math.floor(diffHr / 24)}d`;
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function initApp() {
      const deviceId = getOrCreateDeviceId();
      try {
        const res = await fetch(`${API_BASE}/identity/init`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId },
          body: JSON.stringify({ deviceId, preferredHandle: localStorage.getItem(STORAGE_HANDLE_KEY) || undefined })
        });
        const data = await res.json();
        if (data.handle) {
          state.myHandle = data.handle;
          localStorage.setItem(STORAGE_HANDLE_KEY, data.handle);
        }
      } catch (e) {}

      await Promise.all([loadFeed(), loadInbox(false), loadTrending()]);
      render();

      // Phase 5: Real-Time Auto-Refresh for BOTH Inbox (6s) and Visual Feed + Trending (10s)
      setInterval(() => {
        if (!state.isComposerOpen && !state.activeStoryMsg && state.route === 'main') {
          loadInbox(true);
        }
      }, 6000);
      setInterval(() => {
        if (!state.isComposerOpen && !state.activeStoryMsg && state.route === 'main') {
          loadFeed();
          loadTrending();
        }
      }, 10000);
    }

    async function loadTrending() {
      try {
        const res = await fetch(`${API_BASE}/posts/trending?period=${encodeURIComponent(state.trendingPeriod)}`, {
          cache: 'no-store'
        });
        if (res.ok) {
          const data = await res.json();
          state.trendingTags = data.trendingTags || [];
          state.trendingPhrases = data.trendingPhrases || [];
          if (Array.isArray(data.dynamicTags) && data.dynamicTags.length > 0) {
            state.dynamicTags = data.dynamicTags;
          }
          render();
        }
      } catch (e) {}
    }

    function getLocalReactionsCache() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_REACTIONS_CACHE_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveLocalReactionState(postId, reactions, myReactions) {
      try {
        const cache = getLocalReactionsCache();
        cache[postId] = { reactions, myReactions, updatedAt: Date.now() };
        localStorage.setItem(STORAGE_REACTIONS_CACHE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

    function mergePostsWithLocalCache(serverPosts) {
      const rxCache = getLocalReactionsCache();
      let cachedPosts = [];
      try {
        cachedPosts = JSON.parse(localStorage.getItem(STORAGE_POSTS_CACHE_KEY) || '[]');
      } catch (e) {}

      // Merge any locally created posts that aren't in serverPosts yet
      const serverIds = new Set(serverPosts.map((p) => p._id));
      const merged = [...serverPosts];
      for (const localPost of cachedPosts) {
        if (localPost && localPost._id && !serverIds.has(localPost._id) && !localPost.isHidden) {
          merged.unshift(localPost);
        }
      }

      // Overlay latest reaction state from rxCache
      const finalPosts = merged.map((post) => {
        const rxEntry = rxCache[post._id];
        if (rxEntry) {
          const serverTotal =
            (post.reactions?.fire || 0) +
            (post.reactions?.skull || 0) +
            (post.reactions?.eyes || 0) +
            (post.reactions?.heart || 0);
          const localTotal =
            (rxEntry.reactions?.fire || 0) +
            (rxEntry.reactions?.skull || 0) +
            (rxEntry.reactions?.eyes || 0) +
            (rxEntry.reactions?.heart || 0);
          if (localTotal >= serverTotal || (rxEntry.myReactions && rxEntry.myReactions.length > 0)) {
            return {
              ...post,
              reactions: rxEntry.reactions || post.reactions,
              myReactions: rxEntry.myReactions || post.myReactions
            };
          }
        }
        return post;
      });

      try {
        localStorage.setItem(STORAGE_POSTS_CACHE_KEY, JSON.stringify(finalPosts.slice(0, 60)));
      } catch (e) {}

      return finalPosts;
    }

    function mergeInboxWithLocalCache(handle, serverMessages) {
      const key = `${STORAGE_INBOX_CACHE_KEY}_${handle.toLowerCase()}`;
      let cached = [];
      try {
        cached = JSON.parse(localStorage.getItem(key) || '[]');
      } catch (e) {}

      const byId = new Map();
      for (const msg of serverMessages) {
        byId.set(msg._id, msg);
      }
      for (const localMsg of cached) {
        if (localMsg && localMsg._id && !localMsg.isHidden) {
          const existing = byId.get(localMsg._id);
          if (!existing) {
            byId.set(localMsg._id, localMsg);
          } else if (localMsg.reply && !existing.reply) {
            byId.set(localMsg._id, { ...existing, reply: localMsg.reply, isRead: true, themeId: localMsg.themeId || existing.themeId });
          }
        }
      }

      const merged = Array.from(byId.values()).sort(
        (a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime()
      );
      try {
        localStorage.setItem(key, JSON.stringify(merged.slice(0, 80)));
      } catch (e) {}
      return merged;
    }

    async function loadFeed() {
      const params = new URLSearchParams({ mode: state.feedMode });
      if (state.selectedTag && state.selectedTag !== 'All') {
        params.set('tag', state.selectedTag);
      }
      if (state.selectedPhrase) {
        params.set('phrase', state.selectedPhrase);
      }
      if (state.feedMode === 'near') {
        params.set('lat', String(state.coords.lat));
        params.set('lng', String(state.coords.lng));
        params.set('radiusMiles', '5');
      }
      try {
        const res = await fetch(`${API_BASE}/posts?${params.toString()}`, {
          headers: { 'x-device-id': state.deviceId },
          cache: 'no-store'
        });
        const data = await res.json();
        if (Array.isArray(data.popularTags) && data.popularTags.length > 0) {
          state.dynamicTags = data.popularTags;
        }
        if (Array.isArray(data.trendingTags)) {
          state.trendingTags = data.trendingTags;
        }
        if (Array.isArray(data.trendingPhrases)) {
          state.trendingPhrases = data.trendingPhrases;
        }
        const serverPosts = data.posts || [];
        state.posts =
          state.selectedTag === 'All' && !state.selectedPhrase && state.feedMode === 'global'
            ? mergePostsWithLocalCache(serverPosts)
            : serverPosts.map((p) => {
                const rxEntry = getLocalReactionsCache()[p._id];
                return rxEntry
                  ? { ...p, reactions: rxEntry.reactions, myReactions: (rxEntry.myReactions || []).slice(0, 1) }
                  : p;
              });
      } catch (e) {
        try {
          state.posts = JSON.parse(localStorage.getItem(STORAGE_POSTS_CACHE_KEY) || '[]');
        } catch {}
      }
      render();
    }

    async function loadInbox(isBackgroundPoll = false) {
      const handle = getCurrentHandle();
      try {
        const res = await fetch(`${API_BASE}/inbox?handle=${encodeURIComponent(handle)}`, {
          headers: { 'x-device-id': state.deviceId },
          cache: 'no-store'
        });
        const data = await res.json();
        const nextMessages = mergeInboxWithLocalCache(handle, data.messages || []);
        const nextCount = nextMessages.length;

        if (
          isBackgroundPoll &&
          state.lastKnownInboxCount !== null &&
          nextCount > state.lastKnownInboxCount
        ) {
          playNotificationChime();
          showToast(`🔔 New secret confession just arrived for @${handle}!`);
        }

        state.lastKnownInboxCount = nextCount;
        state.inboxMessages = nextMessages;
        state.unreadCount = nextMessages.filter((m) => !m.isRead).length;
        updateDocumentTitleBadge();
        render();
      } catch (e) {
        const key = `${STORAGE_INBOX_CACHE_KEY}_${handle.toLowerCase()}`;
        try {
          state.inboxMessages = JSON.parse(localStorage.getItem(key) || '[]');
          render();
        } catch {}
      }
    }

    window.navigateToAsk = (handle) => {
      state.route = 'ask';
      state.askTargetHandle = handle;
      state.askSentSuccess = false;
      state.askQuestion = '';
      window.history.pushState({}, '', `/ask/${encodeURIComponent(handle)}`);
      render();
    };

    window.navigateToMain = (screen = 'feed', openComposer = false) => {
      state.route = 'main';
      state.activeScreen = screen;
      if (openComposer) {
        state.isComposerOpen = true;
      }
      window.history.pushState({}, '', screen === 'inbox' ? '/?tab=inbox' : '/');
      loadFeed();
      loadInbox(false);
      render();
    };

    window.openCardComposer = () => {
      state.isComposerOpen = true;
      render();
    };

    window.addEventListener('popstate', () => {
      if (window.location.pathname.startsWith('/ask/')) {
        state.route = 'ask';
        state.askTargetHandle = decodeURIComponent(window.location.pathname.replace(/^\/ask\//, '') || 'GoldenWizard');
      } else {
        state.route = 'main';
      }
      render();
    });

    window.handleRerollIdentity = async () => {
      state.demoGoldenWizard = false;
      state.lastKnownInboxCount = null;
      const res = await fetch(`${API_BASE}/identity/reroll`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-device-id': state.deviceId },
        body: JSON.stringify({ deviceId: state.deviceId })
      });
      const data = await res.json();
      if (data.handle) {
        state.myHandle = data.handle;
        localStorage.setItem(STORAGE_HANDLE_KEY, data.handle);
        await loadInbox(false);
        showToast(`🎲 Switched auto-handle to @${data.handle}`);
      }
    };

    // Phase 5: EXCLUSIVE SINGLE REACTION PER USER PER POST (1 User = Max 1 Reaction)
    window.handleReactPost = async (postId, type) => {
      // 1. Immediate optimistic update enforcing max 1 reaction per post
      state.posts = state.posts.map((p) => {
        if (p._id !== postId) return p;
        const rx = { ...(p.reactions || { fire: 0, skull: 0, eyes: 0, heart: 0 }) };
        const currentMy = Array.isArray(p.myReactions) ? [...p.myReactions] : [];
        const alreadyHadThis = currentMy.includes(type);

        // Decrement any previously active reaction on this post first
        for (const prevType of currentMy) {
          rx[prevType] = Math.max(0, (rx[prevType] || 1) - 1);
        }

        let nextMy = [];
        if (!alreadyHadThis) {
          rx[type] = (rx[type] || 0) + 1;
          nextMy = [type];
        }

        saveLocalReactionState(postId, rx, nextMy);
        return { ...p, reactions: rx, myReactions: nextMy };
      });
      try {
        localStorage.setItem(STORAGE_POSTS_CACHE_KEY, JSON.stringify(state.posts.slice(0, 60)));
      } catch (e) {}
      render();

      // 2. Sync to Backend API & disk database
      try {
        const res = await fetch(`${API_BASE}/posts/${postId}/react`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-device-id': state.deviceId },
          body: JSON.stringify({ deviceId: state.deviceId, type })
        });
        const data = await res.json();
        if (res.ok && data.reactions) {
          const singleMy = (data.myReactions || []).slice(0, 1);
          saveLocalReactionState(postId, data.reactions, singleMy);
          state.posts = state.posts.map((p) =>
            p._id === postId
              ? { ...p, reactions: data.reactions, myReactions: singleMy }
              : p
          );
          localStorage.setItem(STORAGE_POSTS_CACHE_KEY, JSON.stringify(state.posts.slice(0, 60)));
          render();
        }
      } catch (e) {}
    };

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, currentY);
      return currentY + lineHeight;
    }

    // Phase 4: Export ANY Visual Feed Confession Card as a 1080x1920 (9:16) Instagram/Snapchat Story PNG
    window.handleShareFeedCardStory = (postId) => {
      const post = state.posts.find((p) => p._id === postId);
      if (!post) return;

      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext('2d');

      // Dark Streetwear Backdrop
      ctx.fillStyle = '#0D0D11';
      ctx.fillRect(0, 0, 1080, 1920);

      // Top Streetwear Flyer Header
      ctx.fillStyle = '#CCFF00';
      ctx.fillRect(270, 130, 540, 82);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.strokeRect(270, 130, 540, 82);
      ctx.fillStyle = '#0D0D11';
      ctx.font = '900 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🔥 EMOUS COMMUNITY FEED', 540, 184);

      // Main 9:16 Center Confession Card
      const cardX = 85, cardY = 290, cardW = 910, cardH = 1180;
      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 20, cardY + 20, cardW, cardH);

      const colors = post.background?.colors || ['#FF1E8E', '#7928CA'];
      const grad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
      grad.addColorStop(0, colors[0] || '#FF1E8E');
      grad.addColorStop(1, colors[1] || '#7928CA');
      ctx.fillStyle = grad;
      ctx.fillRect(cardX, cardY, cardW, cardH);
      ctx.lineWidth = 10;
      ctx.strokeRect(cardX, cardY, cardW, cardH);

      // Author Pill
      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 55, cardY + 55, 420, 68);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 28px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`🎭 @${post.authorHandle}`, cardX + 80, cardY + 99);

      // Confession Text
      ctx.fillStyle = post.background?.textColor || '#FFFFFF';
      ctx.font = '900 54px sans-serif';
      wrapCanvasText(ctx, `“${post.content}”`, cardX + 60, cardY + 250, cardW - 120, 74);

      // Tag Badge at Bottom of Card
      ctx.fillStyle = post.background?.badgeBg || '#CCFF00';
      ctx.fillRect(cardX + 55, cardY + cardH - 135, 390, 74);
      ctx.strokeRect(cardX + 55, cardY + cardH - 135, 390, 74);
      ctx.fillStyle = post.background?.badgeText || '#0D0D11';
      ctx.font = '900 28px sans-serif';
      ctx.fillText(post.tag, cardX + 80, cardY + cardH - 88);

      // Reaction Summary Pill
      const rx = post.reactions || { fire: 0, skull: 0, eyes: 0, heart: 0 };
      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 475, cardY + cardH - 135, 380, 74);
      ctx.fillStyle = '#FFE600';
      ctx.font = '800 26px sans-serif';
      ctx.fillText(`🔥 ${rx.fire}  💀 ${rx.skull}  👀 ${rx.eyes}  ❤️ ${rx.heart}`, cardX + 500, cardY + cardH - 88);

      // Bottom Watermark CTA
      ctx.fillStyle = '#FF1E8E';
      ctx.fillRect(200, 1620, 680, 112);
      ctx.strokeRect(200, 1620, 680, 112);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`emous.app/ask/${post.authorHandle}`, 540, 1688);

      const a = document.createElement('a');
      a.download = `emous-card-${post.authorHandle.toLowerCase()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
      showToast('📸 Downloaded 9:16 Feed Card Story Image (PNG)!');
    };

    function exportStoryCanvasPng(handle, question, reply, themeId) {
      const theme = STORY_THEMES.find((t) => t.id === themeId) || STORY_THEMES[0];
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = theme.canvasBg;
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.fillStyle = '#FFE600';
      ctx.fillRect(290, 120, 500, 76);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.strokeRect(290, 120, 500, 76);
      ctx.fillStyle = '#0D0D11';
      ctx.font = '900 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`ASK @${handle.toUpperCase()}`, 540, 170);

      const cardX = 90, topY = 260, cardW = 900, cardH = 620;
      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 18, topY + 18, cardW, cardH);
      ctx.fillStyle = theme.topCardBg;
      ctx.fillRect(cardX, topY, cardW, cardH);
      ctx.strokeRect(cardX, topY, cardW, cardH);

      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 45, topY + 45, 380, 58);
      ctx.fillStyle = '#CCFF00';
      ctx.font = '800 25px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('🤫 ANONYMOUS CONFESSION', cardX + 65, topY + 83);

      ctx.fillStyle = theme.topCardText;
      ctx.font = '800 46px sans-serif';
      wrapCanvasText(ctx, `"${question}"`, cardX + 55, topY + 190, cardW - 110, 64);

      const botY = 950;
      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 18, botY + 18, cardW, cardH);
      ctx.fillStyle = theme.bottomCardBg;
      ctx.fillRect(cardX, botY, cardW, cardH);
      ctx.strokeRect(cardX, botY, cardW, cardH);

      ctx.fillStyle = '#000000';
      ctx.fillRect(cardX + 45, botY + 45, 360, 58);
      ctx.fillStyle = '#FFE600';
      ctx.font = '800 25px sans-serif';
      ctx.fillText(`⚡ @${handle.toUpperCase()} REPLIED`, cardX + 65, botY + 83);

      ctx.fillStyle = theme.bottomCardText;
      ctx.font = '800 48px sans-serif';
      wrapCanvasText(ctx, reply, cardX + 55, botY + 190, cardW - 110, 66);

      ctx.fillStyle = '#FF1E8E';
      ctx.fillRect(220, 1680, 640, 106);
      ctx.strokeRect(220, 1680, 640, 106);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`emous.app/ask/${handle}`, 540, 1745);

      const a = document.createElement('a');
      a.download = `emous-story-${handle.toLowerCase()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

                            <button
                              onclick="handleShareFeedCardStory('${post._id}')"
                              class="card-action-pill bg-emous-yellow text-black hover:bg-emous-lime"
                              aria-label="Share 9:16 Story"
                            >
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                                <polyline points="16 6 12 2 8 6"/>
                                <line x1="12" x2="12" y1="2" y2="15"/>
                              </svg>
                              <span class="card-action-label">Share Story</span>
                            </button>

                            <button
                              onclick="navigateToAsk('${escapeHtml(post.authorHandle)}')"
                              class="card-action-pill bg-white text-black hover:bg-emous-lime"
                              aria-label="Ask Secret"
                            >
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                              </svg>
                              <span class="card-action-label">Ask Secret</span>
                            </button>

                            <button
                              onclick="handleFlagPost('${post._id}')"
                              class="card-action-pill ${
                                post.isFlaggedByMe ? 'bg-emous-pink text-white' : 'bg-black/85 text-white hover:bg-red-600'
                              }"
                              aria-label="Report Post"
                            >
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 stroke-[2.5] ${post.isFlaggedByMe ? 'text-white' : 'text-emous-pink'}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                                <line x1="4" x2="4" y1="22" y2="15"/>
                              </svg>
                              <span class="card-action-label">${escapeHtml(reportLabel)}</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </article>
                  `;
                  })
                  .join('')}
              </div>
            </main>
          `
              : `
            <!-- SCREEN 2: "GET YOUR LINK" DASHBOARD -->
            <main class="max-w-4xl mx-auto px-3 pt-3.5 space-y-4">
              <div class="bg-emous-lime text-black rounded-2xl p-4 flyer-card space-y-3">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-1.5">
                    <span class="inline-block bg-black text-emous-yellow text-[9px] font-display font-extrabold px-2 py-0.5 rounded-full uppercase">
                      ✨ VIRAL ANONYMOUS INBOX
                    </span>
                    <button
                      onclick="state.soundAlertsEnabled = !state.soundAlertsEnabled; render();"
                      class="bg-black text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full"
                    >
                      ${state.soundAlertsEnabled ? '🔔 Live Alerts: ON' : '🔕 Alerts: Muted'}
                    </button>
                  </div>

                  <button onclick="handleToggleDemoHandle()" class="bg-white text-black text-[10px] font-extrabold px-2.5 py-1 rounded-lg border-2 border-black shadow-brutal">
                    ${state.demoGoldenWizard ? `👤 My Handle (@${escapeHtml(state.myHandle)})` : '🧙‍♂️ @GoldenWizard Demo'}
                  </button>
                </div>

                <h1 class="font-display font-extrabold ${compact ? 'text-base' : 'text-xl sm:text-2xl'} leading-tight">
                  🤫 Drop your link on your socials & get anonymous confessions!
                </h1>

                <div class="bg-white rounded-xl p-2.5 border-2 border-black shadow-brutal space-y-2">
                  <div class="flex items-center gap-1.5 overflow-hidden">
                    <span class="bg-emous-pink text-white font-display font-extrabold text-[9px] px-1.5 py-0.5 rounded border border-black shrink-0">LINK</span>
                    <span class="font-display font-extrabold text-xs text-black truncate">
                      emous.app/ask/${escapeHtml(currentHandle)}
                    </span>
                  </div>
                  <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="handleCopyLink()" class="bg-emous-pink text-white font-display font-extrabold text-[10px] py-2 px-2 rounded-lg flyer-btn uppercase text-center truncate">
                      🔗 Copy Link
                    </button>
                    <button onclick="navigateToAsk('${escapeHtml(currentHandle)}')" class="bg-emous-yellow text-black font-display font-extrabold text-[10px] py-2 px-2 rounded-lg flyer-btn uppercase text-center truncate">
                      🚀 Open Link
                    </button>
                    <button onclick="handleSimulateIncomingSecret()" class="bg-black text-emous-lime font-display font-extrabold text-[10px] py-2 px-2 rounded-lg flyer-btn uppercase text-center truncate" title="Simulate a fan sending you a secret note right now">
                      🔔 Test Live Note
                    </button>
                  </div>
                </div>
              </div>

              <!-- Secret Notes Inbox Grid -->
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="font-display font-extrabold text-sm sm:text-lg flex items-center gap-1.5">
                    <span>🕵️ Secret Notes (@${escapeHtml(currentHandle)})</span>
                    <span class="bg-emous-yellow text-black text-[10px] px-2 py-0.5 rounded-full border-2 border-black">${state.inboxMessages.length}</span>
                  </h2>
                  <button onclick="openCardComposer()" class="bg-emous-yellow text-black font-display font-extrabold text-[10px] px-2.5 py-1 rounded-lg flyer-btn uppercase">
                    + New Feed Card
                  </button>
                </div>

                <div class="grid ${gridColsClass}">
                  ${state.inboxMessages
                    .map((msg) => {
                      const pair = STORY_THEMES.find((t) => t.id === msg.themeId) || STORY_THEMES[0];
                      return `
                      <div class="bg-emous-surface rounded-2xl p-3.5 flyer-card flex flex-col justify-between gap-2.5">
                        <div class="flex items-center justify-between gap-2">
                          <span style="background-color: ${msg.isRead ? '#FFE600' : '#FF1E8E'}; color: ${msg.isRead ? '#0D0D11' : '#FFFFFF'}" class="text-[9px] font-display font-extrabold uppercase px-2 py-0.5 rounded-full border-2 border-black">
                            ${msg.isRead ? '✉️ Opened' : '🔥 New Secret'}
                          </span>
                          <span class="text-[10px] font-bold text-neutral-400">${formatRelativeTime(msg.createdAt)} • 30d burn</span>
                        </div>

                        <div style="background-color: ${pair.topCardBg}; color: ${pair.topCardText}" class="rounded-xl p-3 border-2 border-black shadow-brutal font-sans font-extrabold text-xs sm:text-sm leading-snug">
                          “${escapeHtml(msg.question)}”
                        </div>

                        ${
                          msg.reply
                            ? `
                          <div style="background-color: ${pair.bottomCardBg}; color: ${pair.bottomCardText}" class="rounded-xl p-2.5 border-2 border-black text-xs font-bold">
                            <span class="block text-[8px] uppercase font-extrabold opacity-75 mb-0.5">Your Story Reply:</span>
                            ${escapeHtml(msg.reply)}
                          </div>
                        `
                            : ''
                        }

                        <div class="flex items-center justify-between gap-2 pt-0.5">
                          <button onclick="handleOpenStoryModal('${msg._id}')" class="flex-1 bg-emous-lime text-black font-display font-extrabold text-[10px] py-2 px-3 rounded-xl flyer-btn uppercase">
                            📸 ${msg.reply ? 'Share 9:16 Story' : 'Reply & Share Story'}
                          </button>
                          <button onclick="handleFlagInbox('${msg._id}')" class="card-action-pill bg-black text-neutral-300 hover:bg-red-600 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-emous-pink" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                              <line x1="4" x2="4" y1="22" y2="15"/>
                            </svg>
                            <span class="card-action-label">Report</span>
                          </button>
                        </div>
                      </div>
                    `;
                    })
                    .join('')}
                </div>
              </div>
            </main>
          `
          }

          ${renderComposerModal()}

          <!-- SCREEN 4: 9:16 INSTAGRAM / SNAPCHAT STORY SHARE GENERATOR MODAL -->
          ${
            state.activeStoryMsg
              ? `
            <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-2.5 overflow-y-auto">
              <div class="bg-emous-surface w-full ${
                compact ? 'max-w-[355px] p-3.5 grid-cols-1' : 'max-w-2xl p-6 grid-cols-1 md:grid-cols-2'
              } rounded-2xl flyer-card grid gap-4 items-center my-auto">
                <div class="flex justify-center">
                  <div style="background-color: ${activeStoryTheme.canvasBg}" class="w-[215px] h-[382px] rounded-2xl p-3 flyer-card flex flex-col justify-between relative overflow-hidden">
                    <div class="text-center">
                      <span class="inline-block bg-emous-yellow text-black font-display font-extrabold text-[8px] uppercase px-2 py-0.5 rounded border-2 border-black shadow-brutal">
                        ASK @${escapeHtml(currentHandle)}
                      </span>
                    </div>

                    <div style="background-color: ${activeStoryTheme.topCardBg}; color: ${activeStoryTheme.topCardText}" class="rounded-xl p-2.5 border-2 border-black shadow-brutal space-y-1">
                      <span class="inline-block bg-black text-emous-lime text-[7px] font-extrabold uppercase px-1.5 py-0.5 rounded">
                        🤫 ANONYMOUS CONFESSION
                      </span>
                      <p class="font-sans font-extrabold text-xs leading-snug">
                        “${escapeHtml(state.activeStoryMsg.question)}”
                      </p>
                    </div>

                    <div style="background-color: ${activeStoryTheme.bottomCardBg}; color: ${activeStoryTheme.bottomCardText}" class="rounded-xl p-2.5 border-2 border-black shadow-brutal space-y-1">
                      <span class="inline-block bg-black text-emous-yellow text-[7px] font-extrabold uppercase px-1.5 py-0.5 rounded">
                        ⚡ @${escapeHtml(currentHandle)} REPLIED
                      </span>
                      <p id="story-live-reply-preview" class="font-sans font-extrabold text-xs leading-snug">
                        ${escapeHtml(state.replyText.trim() || 'Type your comeback below... 👀')}
                      </p>
                    </div>

                    <div class="text-center">
                      <span class="inline-block bg-emous-pink text-white font-display font-extrabold text-[8px] px-2 py-0.5 rounded-full border-2 border-black">
                        emous.app/ask/${escapeHtml(currentHandle)}
                      </span>
                    </div>
                  </div>
                </div>

                <div class="space-y-2.5">
                  <div class="flex items-center justify-between">
                    <div>
                      <span class="text-[9px] font-extrabold uppercase text-emous-lime">9:16 STORY GENERATOR</span>
                      <h3 class="font-display font-extrabold text-base">Reply & Share to Story</h3>
                    </div>
                    <button onclick="state.activeStoryMsg = null; render();" class="bg-black text-white px-2.5 py-1 rounded-lg border-2 border-white/20 text-xs font-bold">✕</button>
                  </div>

                  <div>
                    <textarea
                      rows="2"
                      maxlength="300"
                      oninput="state.replyText = this.value; document.getElementById('story-live-reply-preview').textContent = this.value.trim() || 'Type your comeback below... 👀';"
                      placeholder="Type your response for the bottom card..."
                      class="w-full bg-black text-white rounded-xl p-2.5 border-2 border-white/25 font-sans font-bold text-xs focus:outline-none focus:border-emous-lime resize-none"
                    >${escapeHtml(state.replyText)}</textarea>
                  </div>

                  <div class="flex flex-wrap gap-1">
                    ${STORY_THEMES.map(
                      (pair) => `
                      <button
                        type="button"
                        onclick="state.storyThemeId = '${pair.id}'; render();"
                        class="px-2 py-1 rounded-lg text-[10px] font-extrabold border-2 border-black ${
                          state.storyThemeId === pair.id ? 'bg-emous-yellow text-black shadow-brutal' : 'bg-black text-neutral-300'
                        }"
                      >
                        ${pair.name}
                      </button>
                    `
                    ).join('')}
                  </div>

                  <div class="pt-1 space-y-1.5">
                    <button onclick="handleSaveStoryReply(true)" class="w-full bg-emous-pink text-white font-display font-extrabold text-xs py-2.5 px-3 rounded-xl flyer-btn uppercase">
                      📸 Download 9:16 Story PNG
                    </button>
                    <button onclick="handleSaveStoryReply(false)" class="w-full bg-emous-lime text-black font-display font-extrabold text-[10px] py-2 px-3 rounded-xl flyer-btn uppercase">
                      Save Reply Only
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `
              : ''
          }
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const toastHtml = state.toast
        ? `<div class="fixed top-3 right-3 left-3 sm:left-auto z-50 bg-emous-lime text-black font-display font-extrabold text-xs px-4 py-2.5 rounded-xl flyer-card text-center">${escapeHtml(state.toast)}</div>`
        : '';

      const simulatorToggleHtml = `
        <div class="hidden md:flex fixed bottom-5 right-5 z-50 items-center gap-2">
          <button
            onclick="state.mobileSimulator = !state.mobileSimulator; render();"
            class="bg-emous-yellow text-black font-display font-extrabold text-xs px-4 py-2.5 rounded-2xl flyer-btn uppercase flex items-center gap-2"
          >
            <span>${state.mobileSimulator ? '🖥️ Full Web View' : '📱 Mobile App Frame'}</span>
          </button>
        </div>
      `;

      const pageContent = state.route === 'ask' ? renderAskReceiverScreen() : renderMainApp();
      root.innerHTML =
        toastHtml +
        simulatorToggleHtml +
        (state.mobileSimulator
          ? `<div class="py-4 px-2 flex justify-center"><div class="w-[375px] max-w-full border-[5px] border-black rounded-[36px] shadow-2xl overflow-hidden bg-emous-bg relative">${pageContent}</div></div>`
          : pageContent);
    }

    initApp();
  </script>
</body>
</html>
